server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    location /eris/ {
        try_files $uri $uri/ /eris/index.html;
    }

    location / {
        try_files $uri /eris$uri /eris/index.html;
    }
}
