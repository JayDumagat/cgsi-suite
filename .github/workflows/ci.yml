name: CI and release images

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/authentication-service/package-lock.json
      - run: npm ci --prefix services/authentication-service
      - run: npm run lint:identity
      - run: npm run test:identity
      - run: go -C services test ./...
      - run: go -C services vet ./...
      - run: go -C services build ./...

  frontend:
    name: Frontend checks and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/cube/package-lock.json
      - run: npm run setup:frontends
      - run: npm run lint:frontends
      - run: npm run test:frontends

  compose-smoke:
    name: Container build and integration smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: docker compose config --quiet
      - run: docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet
        env:
          CGSI_IMAGE_PREFIX: ghcr.io/example
          CGSI_IMAGE_TAG: ci
      - run: docker compose build authorization-service identity-service app-catalog-service crm-service billing-service cube-web cdex-web bils-web gateway
      - run: docker compose up --detach gateway
      - run: npm run smoke:local
      - if: always()
        run: docker compose down --volumes --remove-orphans

  publish:
    name: Publish versioned images
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [backend, frontend, compose-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: cgsi-suite-authorization-service
            dockerfile: services/Dockerfile
            service: authorization-service
          - image: cgsi-suite-identity-service
            dockerfile: services/authentication-service/Dockerfile
            service: ""
          - image: cgsi-suite-cube-web
            dockerfile: apps/cube/Dockerfile
            service: ""
          - image: cgsi-suite-cdex-web
            dockerfile: apps/cdex/Dockerfile
            service: ""
          - image: cgsi-suite-bils-web
            dockerfile: apps/bils/Dockerfile
            service: ""
          - image: cgsi-suite-app-catalog-service
            dockerfile: services/Dockerfile
            service: app-catalog-service
          - image: cgsi-suite-cdex-service
            dockerfile: services/Dockerfile
            service: crm-service
          - image: cgsi-suite-bils-service
            dockerfile: services/Dockerfile
            service: billing-service
          - image: cgsi-suite-gateway
            dockerfile: infra/nginx/Dockerfile
            service: ""
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image-owner
        shell: bash
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: SERVICE=${{ matrix.service }}
          tags: |
            ghcr.io/${{ steps.image-owner.outputs.value }}/${{ matrix.image }}:${{ github.ref_name }}
            ghcr.io/${{ steps.image-owner.outputs.value }}/${{ matrix.image }}:latest
