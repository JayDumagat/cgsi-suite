name: CI and release images

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/authentication-service/package-lock.json
      - run: npm ci --prefix backend/authentication-service
      - run: npm run lint --prefix backend/authentication-service
      - run: npm run test --prefix backend/authentication-service
      - run: go -C backend test ./...
      - run: go -C backend vet ./...
      - run: go -C backend build ./...

  frontend:
    name: Frontend checks and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/cube-portal/package-lock.json
            frontend/crm-portal/package-lock.json
            frontend/billing-portal/package-lock.json
            frontend/hris-portal/package-lock.json
      - run: npm ci --prefix frontend/cube-portal
      - run: npm run build --prefix frontend/cube-portal
      - run: npm ci --prefix frontend/crm-portal
      - run: npm run build --prefix frontend/crm-portal
      - run: npm ci --prefix frontend/billing-portal
      - run: npm run build --prefix frontend/billing-portal
      - run: npm ci --prefix frontend/hris-portal
      - run: npm run build --prefix frontend/hris-portal

  compose-smoke:
    name: Container build and integration smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: docker compose config --quiet
        env:
          NPM_ADMIN_EMAIL: admin@cgsi.local
          NPM_ADMIN_PASSWORD: ci-only-not-a-real-secret
      - run: docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet
        env:
          CGSI_IMAGE_PREFIX: ghcr.io/example
          CGSI_IMAGE_TAG: ci
      - run: docker compose build authorization-service identity-service app-catalog-service crm-service billing-service cube-web cdex-web bils-web eris-web gateway
      - run: docker compose up --detach nginx-proxy-manager-bootstrap
        env:
          NPM_ADMIN_EMAIL: admin@cgsi.local
          NPM_ADMIN_PASSWORD: ci-only-not-a-real-secret
      - run: npm run smoke:local
      - if: always()
        run: docker compose down --volumes --remove-orphans

  publish:
    name: Publish versioned images
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [backend, frontend, compose-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: cgsi-suite-authorization-service
            dockerfile: backend/Dockerfile
            service: authorization-service
          - image: cgsi-suite-identity-service
            dockerfile: backend/authentication-service/Dockerfile
            service: ""
          - image: cgsi-suite-cube-web
            dockerfile: frontend/cube-portal/Dockerfile
            service: ""
          - image: cgsi-suite-cdex-web
            dockerfile: frontend/crm-portal/Dockerfile
            service: ""
          - image: cgsi-suite-bils-web
            dockerfile: frontend/billing-portal/Dockerfile
            service: ""
          - image: cgsi-suite-eris-web
            dockerfile: frontend/hris-portal/Dockerfile
            service: ""
          - image: cgsi-suite-app-catalog-service
            dockerfile: backend/Dockerfile
            service: app-catalog-service
          - image: cgsi-suite-cdex-service
            dockerfile: backend/Dockerfile
            service: crm-service
          - image: cgsi-suite-bils-service
            dockerfile: backend/Dockerfile
            service: billing-service
          - image: cgsi-suite-gateway
            dockerfile: infra/nginx/Dockerfile
            service: ""
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image-owner
        shell: bash
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: SERVICE=${{ matrix.service }}
          tags: |
            ghcr.io/${{ steps.image-owner.outputs.value }}/${{ matrix.image }}:${{ github.ref_name }}
            ghcr.io/${{ steps.image-owner.outputs.value }}/${{ matrix.image }}:latest
